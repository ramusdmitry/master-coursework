# Корневой Hydra-конфиг для CP7 (Meta-Labeling, MLflow, MinIO)
# Используется в src/train.py и src/predict_prd.py через @hydra.main

defaults:
  - data: default
  - model: meta_labeling
  - mlflow: local
  - _self_

# Глобальный seed для воспроизводимости
seed: 42

# Не менять рабочий каталог на output-папку Hydra: относительные пути к данным
# (data/processed) резолвятся от каталога запуска (checkpoint7/), иначе реальные
# parquet не находятся и пайплайн всегда уходит в синтетический fallback.
hydra:
  job:
    chdir: false
